name: PVE Production Smoke Once

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/pve-production-smoke-once.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production main
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run production PVE smoke
        run: npm run pve:production:smoke -- --mode pve
