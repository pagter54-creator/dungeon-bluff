name: PVE Production Smoke

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  pve-smoke:
    if: github.event.issue.pull_request && github.event.comment.body == '/pve-production-smoke' && github.actor == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run production COOP_PVE smoke
        run: npm run pve:production:smoke -- --mode pve
