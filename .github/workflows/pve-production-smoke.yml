name: PVE Production Smoke

# Explicit opt-in only: creates real anonymous Auth accounts, rooms and game
# state in production. Leaving rooms does not delete the anonymous accounts.
on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      mode:
        description: 'Creates real production users/rooms/game state; choose smoke mode'
        type: choice
        options: [competitive, pve]
        default: competitive
      acknowledge_writes:
        description: 'I understand this creates real data in production'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: supabase-production
  cancel-in-progress: false

jobs:
  pve-smoke:
    if: >-
      (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
       github.event.comment.body == '/pve-production-smoke' && github.actor == github.repository_owner) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.acknowledge_writes)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run explicit production smoke (creates real data)
        env:
          SMOKE_MODE: ${{ inputs.mode || 'pve' }}
        run: npm run pve:production:smoke -- --mode "$SMOKE_MODE"
