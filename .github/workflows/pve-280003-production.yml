name: PVE 280003 Production Security Migration

on:
  push:
    branches:
      - feat/pve-core-001-004
    paths:
      - ".github/workflows/pve-280003-production.yml"

permissions:
  contents: read

concurrency:
  group: pve-280003-production
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Verify deployment secrets and production ref
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_PROJECT_ID"
          test -n "$SUPABASE_DB_URL"
          CONFIG_REF="$(node --input-type=module -e "import('./config.js').then(m=>console.log(new URL(m.SUPABASE_URL).hostname.split('.')[0]))")"
          test "$CONFIG_REF" = "$SUPABASE_PROJECT_ID"

      - name: Verify exactly 280003 is pending
        shell: bash
        run: |
          set -euo pipefail
          DRY="$(supabase db push --dry-run --db-url "$SUPABASE_DB_URL" 2>&1)"
          printf '%s\n' "$DRY"
          mapfile -t PENDING < <(printf '%s\n' "$DRY" | grep -oE '20[0-9]{10}_[A-Za-z0-9_-]+\.sql' | awk '!seen[$0]++')
          test "${#PENDING[@]}" -eq 1
          test "${PENDING[0]}" = "202609280003_pve_abandon_rpc_privileges.sql"

      - name: Apply 280003
        run: supabase db push --db-url "$SUPABASE_DB_URL"

      - name: Verify 280003 applied and no migration remains pending
        shell: bash
        run: |
          set -euo pipefail
          LIST="$(supabase migration list --db-url "$SUPABASE_DB_URL" 2>&1)"
          printf '%s\n' "$LIST"
          printf '%s\n' "$LIST" | grep -q '202609280003'
          DRY="$(supabase db push --dry-run --db-url "$SUPABASE_DB_URL" 2>&1)"
          printf '%s\n' "$DRY"
          if printf '%s\n' "$DRY" | grep -qE '20[0-9]{10}_[A-Za-z0-9_-]+\.sql'; then
            echo "Unexpected pending migration remains."
            exit 1
          fi

      - name: Competitive production remote smoke
        run: npm run pve:production:smoke -- --mode competitive
