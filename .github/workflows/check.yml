name: Project Checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run project checks
        run: npm run check

      - name: Run PVE stress smoke
        run: npm run pve:stress:smoke

      - name: Upload PVE stress reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pve-stress-smoke-${{ github.sha }}
          path: artifacts/pve-stress/
          if-no-files-found: error
